name: PSE Fresh Model Training

on:
  schedule:
    # GitHub cron uses UTC: 00:00 UTC is 08:00 Philippine Time (UTC+8).
    # Run quarterly on February, May, August, and November 28.
    - cron: "0 0 28 2,5,8,11 *"
  workflow_dispatch: {}

concurrency:
  group: pse-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    name: Train all configured PSE companies
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q

      - name: Verify clean backend imports
        working-directory: backend
        run: |
          python - <<'PY'
          import src.models.arima
          import src.models.lag_regression
          import src.models.lstm
          import src.training.train_arima
          import src.training.train_lir
          import src.training.train_lstm
          import src.training.orchestration
          print("clean imports: PASS")
          PY

      - name: Validate raw OHLCV inputs
        working-directory: backend
        run: python -m scripts.validate_raw --all --verbose

      - name: Run complete fresh training lifecycle
        working-directory: backend
        run: python -m scripts.train_all --all --fresh --verbose

      - name: Validate complete fresh artifacts
        working-directory: backend
        run: |
          python -m scripts.validate_production_artifacts \
            --skip-manifest \
            --require-forecasts \
            --require-current-data \
            --verbose

      - name: Validate generated frontend JSON
        working-directory: backend
        run: python -m scripts.validate_frontend_forecasts --verbose

      - name: Create and validate production manifest
        working-directory: backend
        run: |
          python -m scripts.validate_production_artifacts \
            --create-manifest \
            --run-id "${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --source-branch "${{ github.ref_name }}" \
            --require-forecasts \
            --require-current-data \
            --verbose

      - name: Upload verified production artifact package
        uses: actions/upload-artifact@v4
        with:
          name: forecastph-backend-artifacts
          path: |
            backend/artifacts/models
            backend/artifacts/evaluations
            backend/artifacts/production_manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit frontend forecast data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- frontend/public/forecasts
          if git diff --cached --quiet; then
            echo "No frontend forecast changes to commit."
          else
            git commit -m "Automated fresh model training ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
